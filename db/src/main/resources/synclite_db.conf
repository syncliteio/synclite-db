#==== Server listening port for SyncLite DB HTTP API.
#port = 5555
#===== Number of threads to handle HTTP requests; adjust based on expected load and server resources.
#num-threads = 8
#===== Idle connection timeout in milliseconds; close connections that are idle for too long.
#idle-connection-timeout-ms = 30000
#===== IP/interface to bind the HTTP server; keep localhost for safest default.
#bind-address = 127.0.0.1
#===== Maximum allowed HTTP request payload size in bytes.
#max-request-size-bytes = 1048576
#===== Optional global shared token sent as X-SyncLite-Token header.
#auth-token = change-me
#===== Enable per-application signed-request authentication.
#enable-app-auth = false
#===== Allowed client-server clock drift for signed requests.
#app-auth-timestamp-skew-ms = 300000
#===== How long a nonce stays reserved to block replay attacks.
#app-auth-nonce-ttl-ms = 600000
#===== Maximum in-memory nonce entries retained for replay protection.
#app-auth-nonce-cache-max-entries = 10000
#===== Default page size for SELECT resultset pagination.
#resultset-pagination-size = 1000
#===== Idle timeout in milliseconds for open resultset handles.
#resultset-handle-timeout-ms = 300000
#===== Comma-separated list of application ids allowed for app-auth.
#authorized-apps = app1,app2
#===== Secret used by app1 to generate HMAC signature.
#app.app1.secret = replace-with-long-random-secret
#===== Allowed operations for app1 (initialize, close, begin, commit, rollback, select, next, execute).
#app.app1.allowed-ops = initialize,begin,commit,rollback,select,next,execute,close
#===== Secret used by app2 to generate HMAC signature.
#app.app2.secret = replace-with-long-random-secret
#===== Allowed operations for app2 (example read-only + DML, no lifecycle ops).
#app.app2.allowed-ops = select,next,execute
#===== Enable detailed request logging for debugging; set to INFO or DEBUG as needed.
#===== Directory where synclite_db.trace will be written.
#trace-directory = .
#trace-level = INFO